<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>EscanerWeb</title>
  <link rel="icon" type="image/png" href="assets/site-logo.png">

  <!-- Fuentes modernas -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Font Awesome 6 (gratuito) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <style>
    /* ----------------------------------------------
       VARIABLES CYBERPUNK OPERATIVO
    ----------------------------------------------- */
    :root {
      --bg-deep: #0A0E17;
      --bg-panel: #111827;
      --bg-soft: #0F131C;
      --border: #1F2937;
      --border-glow: #2D3A5E;
      --text-primary: #E5E7EB;
      --text-secondary: #9CA3AF;
      --accent-cyan: #00FFD1;
      --accent-cyan-glow: rgba(0, 255, 209, 0.3);
      --accent-red: #FF0055;
      --accent-red-glow: rgba(255, 0, 85, 0.3);
      --accent-amber: #FFB347;
      --accent-amber-glow: rgba(255, 179, 71, 0.3);
      --green-neon: #22C55E;
      --shadow-card: 0 12px 28px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(0, 255, 209, 0.05);
      --shadow-glow: 0 0 18px var(--accent-cyan-glow), 0 0 42px rgba(255, 0, 85, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg-deep);
      background-image:
        radial-gradient(circle at 50% -12%, rgba(0, 255, 209, 0.10), transparent 32%),
        linear-gradient(180deg, #07101A 0%, #0A0E17 42%, #07111B 100%);
      background-size: auto;
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      line-height: 1.5;
      scroll-behavior: smooth;
      position: relative;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    body::before {
      width: 520px;
      height: 520px;
      inset: auto;
      left: var(--cursor-x, 50vw);
      top: var(--cursor-y, 18vh);
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 255, 209, 0.18), rgba(0, 118, 255, 0.08) 34%, transparent 68%);
      filter: blur(4px);
      opacity: 0.85;
      mix-blend-mode: screen;
      transition: opacity 0.2s ease;
    }

    body::after {
      display: none;
    }

    /* Scrollbar personalizada */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-soft);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--accent-cyan);
      border-radius: 4px;
      box-shadow: 0 0 8px var(--accent-cyan-glow);
    }

    /* Tipografía mono para código */
    .terminal-text, code, pre, .priority-title, .log-line, .pipeline-step-label {
      font-family: 'JetBrains Mono', monospace;
    }

    /* TOPBAR */
    .topbar {
      border-bottom: 1px solid var(--border);
      background: #0A1420;
      backdrop-filter: blur(16px);
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.34), inset 0 -1px 0 rgba(0, 255, 209, 0.08);
    }
    .topbar-inner {
      width: min(1360px, calc(100% - 32px));
      min-height: 92px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      gap: 16px;
      padding: 10px 0;
    }
    .brand {
      min-width: 0;
    }
    .brand strong {
      position: relative;
      display: inline-block;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-weight: 800;
      font-size: clamp(1.65rem, 3.1vw, 3rem);
      line-height: 0.95;
      background: linear-gradient(100deg, #EFFFFC 0%, var(--accent-cyan) 24%, #FFFFFF 42%, #36C8FF 56%, #EFFFFC 76%);
      background-size: 220% 100%;
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      letter-spacing: -2.8px;
      filter: drop-shadow(0 0 18px rgba(0, 255, 209, 0.34));
      animation: titleLightSweep 4.8s ease-in-out infinite;
    }
    .brand strong::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -9px;
      width: min(255px, 86%);
      height: 2px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent-cyan), transparent);
      box-shadow: 0 0 18px var(--accent-cyan-glow);
      opacity: 0.86;
      transform-origin: left;
      animation: titleUnderlinePulse 3.2s ease-in-out infinite;
    }
    .brand-logo-wrap {
      display: grid;
      place-items: center;
      width: clamp(104px, 10vw, 148px);
      aspect-ratio: 1;
      justify-self: center;
      position: relative;
      isolation: isolate;
    }
    .brand-logo-wrap::before {
      content: "";
      position: absolute;
      inset: 20%;
      z-index: -1;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 255, 209, 0.22), transparent 68%);
      filter: blur(13px);
      animation: logoAura 3.6s ease-in-out infinite;
    }
    .brand-logo {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      border: 0;
      outline: 0;
      box-shadow: none;
      background: transparent;
      animation: none;
    }
    .ai-status {
      justify-self: end;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      width: max-content;
      padding: 10px 16px;
      border: 1px solid rgba(0, 255, 209, 0.42);
      border-radius: 999px;
      color: var(--text-primary);
      background: linear-gradient(135deg, rgba(0, 255, 209, 0.16), rgba(0, 255, 209, 0.04));
      box-shadow: 0 0 24px rgba(0, 255, 209, 0.18), inset 0 0 22px rgba(0, 255, 209, 0.06);
      font-size: 0.7rem;
      font-family: 'JetBrains Mono', monospace;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      white-space: nowrap;
    }
    .ai-status .status-light {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent-cyan);
      box-shadow: 0 0 10px var(--accent-cyan), 0 0 24px var(--accent-cyan);
      animation: motorPulse 1.6s ease-in-out infinite;
    }
    .terminal-subtle {
      font-size: 0.7rem;
      font-family: monospace;
      color: var(--accent-cyan);
    }

    /* CONTENEDOR PRINCIPAL */
    .container {
      position: relative;
      z-index: 1;
      width: min(1360px, calc(100% - 32px));
      margin: 28px auto 48px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* PANEL CONSOLA */
    .panel {
      --mouse-x: 50%;
      --mouse-y: 50%;
      --tilt-x: 0deg;
      --tilt-y: 0deg;
      --lift: 0px;
      position: relative;
      isolation: isolate;
      overflow: hidden;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: var(--shadow-card);
      transform: perspective(900px) rotateX(var(--tilt-x)) rotateY(var(--tilt-y)) translateY(var(--lift));
      transition: border 0.2s, box-shadow 0.2s, transform 0.2s;
    }
    .panel::after,
    .terminal-card::after,
    .finding-card::after,
    .correlation-row::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0;
      background: radial-gradient(
        420px circle at var(--mouse-x) var(--mouse-y),
        rgba(0, 255, 209, 0.16),
        rgba(54, 200, 255, 0.06) 34%,
        transparent 62%
      );
      transition: opacity 0.22s ease;
    }
    .panel > *,
    .terminal-card > *,
    .finding-card > *,
    .correlation-row > * {
      position: relative;
      z-index: 1;
    }
    .panel:hover {
      border-color: var(--accent-cyan);
      box-shadow: var(--shadow-card), var(--shadow-glow);
      --lift: -2px;
    }
    .panel:hover::after,
    .terminal-card:hover::after,
    .finding-card:hover::after,
    .correlation-row:hover::after {
      opacity: 1;
    }
    h1 {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--accent-cyan);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      position: relative;
    }
    h1:hover,
    .terminal-card:hover h2,
    .terminal-card:hover h3 {
      animation: glitchText 820ms steps(2, end) 1;
      text-shadow: 1px 0 var(--accent-red), -1px 0 var(--accent-cyan);
    }
    h1 i {
      font-size: 1rem;
    }
    .scan-form {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: flex-end;
    }
    .scan-form label {
      flex: 1;
      min-width: 200px;
    }
    label {
      color: var(--text-secondary);
      font-size: 0.7rem;
      text-transform: uppercase;
      display: block;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      background: var(--bg-soft);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--text-primary);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      outline: none;
      transition: 0.2s;
    }
    input:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 0 2px var(--accent-cyan-glow);
    }
    .buttons {
      display: flex;
      gap: 10px;
    }
    button {
      background: transparent;
      border: 1px solid var(--accent-cyan);
      border-radius: 40px;
      padding: 8px 18px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--accent-cyan);
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      position: relative;
      overflow: hidden;
    }
    button::before {
      content: "";
      position: absolute;
      inset: 0;
      transform: translateX(-115%);
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: transform 0.45s ease;
    }
    button:hover:not(:disabled)::before {
      transform: translateX(115%);
    }
    button:hover:not(:disabled) {
      background: var(--accent-cyan);
      color: #0A0E17;
      box-shadow: 0 0 12px var(--accent-cyan-glow);
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      border-color: var(--text-secondary);
      color: var(--text-secondary);
    }
    #btnGenerarInforme:not(:disabled) {
      background: transparent;
      border-color: var(--accent-red);
      color: var(--accent-red);
    }
    #btnGenerarInforme:hover:not(:disabled) {
      background: var(--accent-red);
      color: #0A0E17;
    }

    /* ESTADO / PROGRESO */
    .status {
      margin-top: 18px;
      padding: 12px;
      border-radius: 12px;
      background: var(--bg-soft);
      border-left: 3px solid var(--accent-cyan);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--text-secondary);
    }
    .status.success {
      border-left-color: var(--green-neon);
      background: rgba(34, 197, 94, 0.08);
    }
    .status.error {
      border-left-color: var(--accent-red);
      background: rgba(255, 0, 85, 0.08);
    }
    .status.loading {
      border-left-color: var(--accent-amber);
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.6; }
      100% { opacity: 1; }
    }
    @keyframes titleLightSweep {
      0%, 100% { background-position: 0% 50%; text-shadow: 0 0 12px rgba(0, 255, 209, 0.18); }
      48% { background-position: 100% 50%; text-shadow: 0 0 26px rgba(0, 255, 209, 0.46), 0 0 46px rgba(54, 200, 255, 0.18); }
    }
    @keyframes titleUnderlinePulse {
      0%, 100% { transform: scaleX(0.72); opacity: 0.58; }
      50% { transform: scaleX(1); opacity: 1; }
    }
    @keyframes logoAura {
      0%, 100% { transform: scale(0.92); opacity: 0.55; }
      50% { transform: scale(1.18); opacity: 1; }
    }
    @keyframes logoFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    @keyframes motorPulse {
      0%, 100% { transform: scale(0.82); opacity: 0.72; }
      50% { transform: scale(1.18); opacity: 1; }
    }
    @keyframes toolPulse {
      0%, 100% { box-shadow: 0 0 7px var(--accent-amber-glow); opacity: 0.78; }
      50% { box-shadow: 0 0 18px var(--accent-amber-glow); opacity: 1; }
    }
    @keyframes glitchText {
      0% { transform: translate(0); }
      18% { transform: translate(1px, -1px); }
      32% { transform: translate(-1px, 1px); }
      48% { transform: translate(1px, 0); }
      64% { transform: translate(-1px, -1px); }
      100% { transform: translate(0); }
    }

    /* RESULTADOS */
    .results {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    /* Dashboard resumen (grid de 3 columnas) */
    .dashboard-top {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 18px;
    }
    .terminal-card {
      --mouse-x: 50%;
      --mouse-y: 50%;
      --tilt-x: 0deg;
      --tilt-y: 0deg;
      --lift: 0px;
      position: relative;
      isolation: isolate;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 18px;
      transform: perspective(900px) rotateX(var(--tilt-x)) rotateY(var(--tilt-y)) translateY(var(--lift));
      transition: transform 0.16s ease, border 0.2s, box-shadow 0.2s;
    }
    .terminal-card {
      overflow: hidden;
    }
    .terminal-card:hover {
      border-color: rgba(0, 255, 209, 0.6);
      box-shadow: var(--shadow-card), var(--shadow-glow);
      --lift: -3px;
    }
    .prioritized-section,
    .prioritized-section:hover,
    .finding-group {
      transform: none !important;
    }
    .terminal-card h2, .terminal-card h3 {
      font-size: 0.7rem;
      text-transform: uppercase;
      color: var(--accent-cyan);
      margin-bottom: 12px;
      letter-spacing: 1px;
    }
    .group-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }
    .group-header h2,
    .group-header h3 {
      margin-bottom: 0;
    }
    .group-header span {
      flex-shrink: 0;
      padding: 4px 9px;
      border: 1px solid rgba(0, 255, 209, 0.28);
      border-radius: 999px;
      background: rgba(0, 255, 209, 0.06);
      color: var(--text-secondary);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
      line-height: 1;
    }
    .target-value {
      font-size: 1.2rem;
      word-break: break-word;
      color: var(--text-primary);
    }
    .rating-letter {
      font-size: 3rem;
      font-weight: 800;
      color: var(--accent-amber);
    }
    .risk-score-value {
      font-size: 2rem;
      font-weight: 700;
      color: var(--accent-cyan);
    }
    .security-dashboard {
      display: grid;
      gap: 14px;
    }
    .dashboard-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 14px;
      padding: 16px 18px;
      border: 1px solid rgba(0, 255, 209, 0.18);
      border-radius: 16px;
      background:
        linear-gradient(135deg, rgba(0, 255, 209, 0.08), transparent 36%),
        linear-gradient(180deg, rgba(17, 24, 39, 0.92), rgba(10, 14, 23, 0.92));
      box-shadow: inset 0 0 24px rgba(0, 255, 209, 0.04);
    }
    .dashboard-head h2 {
      color: var(--text-primary);
      font-size: 1.35rem;
      line-height: 1.1;
      margin-bottom: 4px;
    }
    .dashboard-head p {
      color: var(--text-secondary);
      font-size: 0.82rem;
    }
    .metric-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(132px, 1fr));
      gap: 10px;
    }
    .metric-tile {
      position: relative;
      min-height: 74px;
      padding: 12px;
      border: 1px solid var(--border);
      border-left-width: 3px;
      border-radius: 12px;
      background: rgba(17, 24, 39, 0.84);
      overflow: hidden;
    }
    .metric-tile::after {
      content: "";
      position: absolute;
      inset: auto -20px -28px auto;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: currentColor;
      opacity: 0.06;
    }
    .metric-tile strong {
      display: block;
      color: var(--text-primary);
      font-size: 1.45rem;
      line-height: 1;
      margin-bottom: 8px;
    }
    .metric-tile span {
      color: var(--text-secondary);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
      text-transform: uppercase;
    }
    .metric-critical { color: var(--accent-red); border-left-color: var(--accent-red); }
    .metric-medium,
    .metric-amber { color: var(--accent-amber); border-left-color: var(--accent-amber); }
    .metric-low,
    .metric-cyan { color: var(--accent-cyan); border-left-color: var(--accent-cyan); }
    .metric-info { color: #AEB8CB; border-left-color: #5F6C84; }
    .dashboard-grid {
      display: grid;
      grid-template-columns: minmax(260px, 0.9fr) repeat(2, minmax(280px, 1fr));
      gap: 14px;
    }
    .risk-visual-card,
    .chart-card {
      min-height: 252px;
      background:
        radial-gradient(circle at top right, rgba(0, 255, 209, 0.08), transparent 34%),
        var(--bg-panel);
    }
    .risk-visual-card .risk-score-value {
      margin: 18px 0 20px;
      font-size: 2.35rem;
    }
    .risk-visual-card .risk-score-value span {
      display: block;
      margin-top: 5px;
      color: var(--accent-amber);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
    }
    .risk-progress,
    .chart-track {
      position: relative;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(0, 255, 209, 0.18);
    }
    .risk-progress {
      height: 16px;
    }
    .risk-progress i,
    .chart-track i {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent-cyan), #00A3FF 48%, var(--accent-red));
      box-shadow: 0 0 14px var(--accent-cyan-glow);
    }
    .risk-scale {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      color: var(--text-secondary);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
    }
    .chart-bars {
      display: grid;
      gap: 10px;
    }
    .tool-distribution {
      display: grid;
      grid-template-columns: 156px minmax(0, 1fr);
      align-items: center;
      gap: 18px;
    }
    .tool-donut {
      position: relative;
      display: grid;
      place-items: center;
      width: 138px;
      aspect-ratio: 1;
      justify-self: center;
      border-radius: 50%;
      box-shadow:
        0 0 0 1px rgba(0, 255, 209, 0.2),
        0 0 28px rgba(0, 255, 209, 0.12);
    }
    .tool-donut::before {
      content: "";
      position: absolute;
      inset: 18px;
      border-radius: 50%;
      background: var(--bg-panel);
      border: 1px solid rgba(0, 255, 209, 0.18);
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.35);
    }
    .tool-donut-center {
      position: relative;
      z-index: 1;
      display: grid;
      gap: 3px;
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
    }
    .tool-donut-center strong {
      color: var(--text-primary);
      font-size: 1.35rem;
      line-height: 1;
    }
    .tool-donut-center span {
      color: var(--text-secondary);
      font-size: 0.58rem;
      text-transform: uppercase;
    }
    .chart-row {
      display: grid;
      grid-template-columns: 92px 1fr 34px;
      align-items: center;
      gap: 10px;
      color: var(--text-secondary);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
    }
    .chart-row > span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .chart-row strong {
      color: var(--text-primary);
      text-align: right;
    }
    .chart-track {
      height: 12px;
    }
    .severity-critical .chart-track i { background: var(--accent-red); box-shadow: 0 0 12px var(--accent-red-glow); }
    .severity-high .chart-track i,
    .tool-accent-1 .chart-track i { background: #FF6B00; box-shadow: 0 0 12px rgba(255, 107, 0, 0.25); }
    .severity-medium .chart-track i,
    .tool-accent-2 .chart-track i { background: var(--accent-amber); box-shadow: 0 0 12px var(--accent-amber-glow); }
    .severity-low .chart-track i,
    .tool-accent-0 .chart-track i { background: var(--accent-cyan); box-shadow: 0 0 12px var(--accent-cyan-glow); }
    .severity-info .chart-track i,
    .tool-accent-3 .chart-track i { background: #AEB8CB; box-shadow: none; }

    /* BADGES DE ESTADO */
    .terminal-badge, .badge, .tool-status {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 2px 8px;
      border-radius: 40px;
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      background: var(--bg-deep);
      border: 1px solid var(--border);
    }
    .status-run {
      color: var(--accent-amber);
      border-color: var(--accent-amber);
      background: rgba(255, 179, 71, 0.08);
      text-shadow: 0 0 8px var(--accent-amber-glow);
      animation: toolPulse 1.15s ease-in-out infinite;
    }
    .status-ok {
      color: var(--accent-cyan);
      border-color: var(--accent-cyan);
      background: rgba(0, 255, 209, 0.08);
      text-shadow: 0 0 8px var(--accent-cyan-glow);
      box-shadow: 0 0 10px rgba(0, 255, 209, 0.12);
    }
    .status-fail,
    .status-error {
      color: var(--accent-red);
      border-color: var(--accent-red);
      background: rgba(255, 0, 85, 0.08);
      text-shadow: 0 0 8px var(--accent-red-glow);
      box-shadow: 0 0 10px rgba(255, 0, 85, 0.12);
    }
    .status-skipped { color: var(--accent-amber); border-color: var(--accent-amber); }

    /* PIPELINE TIMELINE */
    .pipeline-card {
      position: relative;
      z-index: 2;
      overflow: visible;
    }
    .pipeline-timeline-scroll {
      overflow: visible;
      padding: 22px 2px 8px;
      scrollbar-width: none;
    }
    .pipeline-timeline-scroll::-webkit-scrollbar {
      display: none;
    }
    .pipeline-stepper {
      position: relative;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0;
      width: 100%;
      min-width: 0;
      padding: 10px 2px 4px;
    }
    .pipeline-stepper::before {
      content: "";
      position: absolute;
      left: 34px;
      right: 34px;
      top: 26px;
      height: 2px;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(0, 255, 209, 0.24), rgba(148, 163, 184, 0.28), rgba(255, 0, 85, 0.18));
      box-shadow: inset 0 0 10px rgba(0, 255, 209, 0.12);
      z-index: 0;
    }
    .pipeline-step {
      position: relative;
      z-index: 1;
      flex: 1;
      min-width: 0;
      display: grid;
      justify-items: center;
      gap: 7px;
      isolation: isolate;
    }
    .pipeline-step::before {
      content: "";
      position: absolute;
      top: 25px;
      left: 0;
      width: 50%;
      height: 4px;
      transform: translateX(-50%);
      border-radius: 999px;
      background: rgba(51, 65, 85, 0.5);
      z-index: -1;
    }
    .pipeline-step.is-first::before {
      display: none;
    }
    .pipeline-success::before {
      background: linear-gradient(90deg, rgba(0, 255, 209, 0.2), rgba(0, 255, 209, 0.9));
      box-shadow: 0 0 12px var(--accent-cyan-glow);
    }
    .pipeline-error::before {
      background: linear-gradient(90deg, rgba(255, 0, 85, 0.16), rgba(255, 0, 85, 0.85));
      box-shadow: 0 0 12px var(--accent-red-glow);
    }
    .pipeline-partial::before {
      background: linear-gradient(90deg, rgba(168, 85, 247, 0.18), rgba(168, 85, 247, 0.82));
      box-shadow: 0 0 12px rgba(168, 85, 247, 0.38);
    }
    .pipeline-skipped::before {
      background: rgba(71, 85, 105, 0.72);
    }
    .pipeline-dot {
      width: 30px;
      height: 30px;
      min-width: 30px;
      padding: 0;
      border-radius: 999px;
      border: 2px solid #64748b;
      background: #334155;
      color: var(--bg-deep);
      display: inline-grid;
      place-items: center;
      cursor: help;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.5rem;
      font-weight: 800;
      line-height: 1;
      box-shadow: 0 0 0 4px rgba(10, 14, 23, 0.92);
      transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease;
    }
    .pipeline-dot:hover,
    .pipeline-dot:focus-visible {
      transform: translateY(-2px) scale(1.08);
      outline: none;
    }
    .pipeline-dot.pending {
      background: #334155;
      border-color: #64748b;
      color: #94A3B8;
      opacity: 0.62;
    }
    .pipeline-dot.running {
      background: #f59e0b;
      border-color: #fbbf24;
      color: #111827;
      box-shadow: 0 0 0 4px rgba(10, 14, 23, 0.92), 0 0 18px rgba(245, 158, 11, 0.65);
      animation: pulsePipeline 1.2s infinite;
    }
    .pipeline-dot.success {
      background: var(--accent-cyan);
      border-color: var(--accent-cyan);
      color: #06131A;
      box-shadow: 0 0 0 4px rgba(10, 14, 23, 0.92), 0 0 14px rgba(0, 255, 208, 0.55);
    }
    .pipeline-dot.error {
      background: #ff3b5c;
      border-color: #ff3b5c;
      color: #18030A;
      box-shadow: 0 0 0 4px rgba(10, 14, 23, 0.92), 0 0 16px rgba(255, 59, 92, 0.55);
    }
    .pipeline-dot.skipped {
      background: #475569;
      border-color: #94a3b8;
      color: #D7DEE9;
      opacity: 0.78;
    }
    .pipeline-dot.partial {
      background: #a855f7;
      border-color: #c084fc;
      color: #F6EEFF;
      box-shadow: 0 0 0 4px rgba(10, 14, 23, 0.92), 0 0 14px rgba(168, 85, 247, 0.45);
    }
    .pipeline-dot.pending:hover:not(:disabled),
    .pipeline-dot.pending:focus-visible {
      background: #334155;
      color: #94A3B8;
    }
    .pipeline-dot.running:hover:not(:disabled),
    .pipeline-dot.running:focus-visible {
      background: #f59e0b;
      color: #111827;
    }
    .pipeline-dot.success:hover:not(:disabled),
    .pipeline-dot.success:focus-visible {
      background: var(--accent-cyan);
      color: #06131A;
    }
    .pipeline-dot.error:hover:not(:disabled),
    .pipeline-dot.error:focus-visible {
      background: #ff3b5c;
      color: #18030A;
    }
    .pipeline-dot.skipped:hover:not(:disabled),
    .pipeline-dot.skipped:focus-visible {
      background: #475569;
      color: #D7DEE9;
    }
    .pipeline-dot.partial:hover:not(:disabled),
    .pipeline-dot.partial:focus-visible {
      background: #a855f7;
      color: #F6EEFF;
    }
    .pipeline-step-label {
      width: 100%;
      max-width: 76px;
      color: var(--text-secondary);
      font-size: 0.55rem;
      line-height: 1.2;
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .pipeline-running .pipeline-step-label {
      color: var(--accent-amber);
    }
    .pipeline-success .pipeline-step-label {
      color: var(--accent-cyan);
    }
    .pipeline-error .pipeline-step-label {
      color: var(--accent-red);
    }
    .pipeline-tooltip {
      position: absolute;
      bottom: calc(100% + 14px);
      top: auto;
      left: 50%;
      transform: translateX(-50%) translateY(4px);
      min-width: 220px;
      width: max-content;
      max-width: 300px;
      padding: 12px;
      background: rgba(8, 13, 28, 0.98);
      border: 1px solid rgba(0, 255, 208, 0.35);
      border-radius: 12px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45), 0 0 18px rgba(0, 255, 209, 0.08);
      color: var(--text-primary);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.16s ease, transform 0.16s ease;
      z-index: 9999;
      text-align: left;
      white-space: normal;
    }
    .pipeline-step.is-first .pipeline-tooltip {
      left: 0;
      transform: translateX(0) translateY(4px);
    }
    .pipeline-step.is-last .pipeline-tooltip {
      left: auto;
      right: 0;
      transform: translateX(0) translateY(4px);
    }
    .pipeline-step:hover .pipeline-tooltip,
    .pipeline-step:focus-within .pipeline-tooltip {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .pipeline-step.is-first:hover .pipeline-tooltip,
    .pipeline-step.is-first:focus-within .pipeline-tooltip,
    .pipeline-step.is-last:hover .pipeline-tooltip,
    .pipeline-step.is-last:focus-within .pipeline-tooltip {
      transform: translateX(0) translateY(0);
    }
    .pipeline-tooltip strong {
      display: block;
      margin-bottom: 6px;
      color: var(--accent-cyan);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      text-transform: uppercase;
    }
    .pipeline-tooltip p {
      margin: 0 0 10px;
      color: var(--text-secondary);
      font-size: 0.78rem;
      line-height: 1.45;
    }
    .pipeline-tooltip dl {
      display: grid;
      gap: 6px;
      margin: 0;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
    }
    .pipeline-tooltip dl div {
      display: grid;
      grid-template-columns: 72px 1fr;
      gap: 8px;
    }
    .pipeline-tooltip dt {
      color: var(--text-secondary);
    }
    .pipeline-tooltip dd {
      margin: 0;
      color: var(--text-primary);
    }
    .pipeline-running .pipeline-tooltip {
      border-color: rgba(245, 158, 11, 0.55);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45), 0 0 18px rgba(245, 158, 11, 0.18);
    }
    .pipeline-error .pipeline-tooltip {
      border-color: rgba(255, 59, 92, 0.58);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45), 0 0 18px rgba(255, 59, 92, 0.2);
    }
    .pipeline-partial .pipeline-tooltip {
      border-color: rgba(192, 132, 252, 0.58);
    }
    @keyframes pulsePipeline {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }

    /* HALLAZGOS PRIORIZADOS */
    .priority-list {
      display: grid;
      gap: 12px;
    }
    .priority-row {
      background: var(--bg-soft);
      border-left: 3px solid var(--accent-cyan);
      border-radius: 12px;
      overflow: hidden;
    }
    .priority-row summary {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      padding: 14px;
      cursor: pointer;
      list-style: none;
    }
    .priority-row summary::-webkit-details-marker {
      display: none;
    }
    .priority-title {
      font-weight: 700;
      flex: 2;
    }
    .priority-body {
      padding: 14px;
      border-top: 1px solid var(--border);
    }

    .finding-groups {
      display: grid;
      gap: 12px;
    }
    .finding-group {
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      background: rgba(10, 14, 23, 0.62);
    }
    .finding-group summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 14px;
      cursor: pointer;
      list-style: none;
      color: var(--accent-cyan);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      text-transform: uppercase;
    }
    .finding-group summary::-webkit-details-marker {
      display: none;
    }
    .finding-grid {
      display: grid;
      gap: 12px;
      padding: 14px;
      border-top: 1px solid var(--border);
    }
    .finding-note {
      padding: 12px 14px;
      border: 1px solid rgba(0, 255, 209, 0.22);
      border-left: 4px solid var(--accent-cyan);
      border-radius: 10px;
      background: rgba(0, 255, 209, 0.06);
      color: var(--text-secondary);
      font-size: 0.82rem;
      line-height: 1.5;
    }
    .finding-card {
      --mouse-x: 50%;
      --mouse-y: 50%;
      --tilt-x: 0deg;
      --tilt-y: 0deg;
      --lift: 0px;
      position: relative;
      isolation: isolate;
      overflow: hidden;
      border: 1px solid var(--border);
      border-left-width: 4px;
      border-radius: 10px;
      padding: 14px;
      display: grid;
      gap: 9px;
      transform: perspective(900px) rotateX(var(--tilt-x)) rotateY(var(--tilt-y)) translateY(var(--lift));
      transition: border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease, transform 0.18s ease;
    }
    .finding-card:hover {
      border-color: rgba(0, 255, 209, 0.48);
      box-shadow: 0 0 0 1px rgba(0, 255, 209, 0.1), 0 14px 28px rgba(0, 0, 0, 0.2);
      --lift: -2px;
    }
    .finding-card header,
    .finding-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }
    .finding-card h3 {
      color: var(--text-primary);
      font-size: 0.95rem;
      line-height: 1.35;
    }
    .finding-card p {
      color: var(--text-secondary);
      font-size: 0.82rem;
    }
    .finding-severity {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 9px;
      border-radius: 999px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.66rem;
      font-weight: 700;
      text-transform: uppercase;
    }
    .finding-meta {
      color: var(--text-secondary);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
    }
    .finding-analysis {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 10px;
    }
    .finding-detail {
      padding: 10px;
      border-radius: 8px;
      background: rgba(10, 14, 23, 0.58);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .finding-detail strong {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
      color: var(--accent-cyan);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
      text-transform: uppercase;
    }
    .finding-detail p {
      margin: 0;
      color: var(--text-secondary);
      font-size: 0.78rem;
      line-height: 1.45;
      white-space: pre-wrap;
    }
    .finding-evidence {
      white-space: pre-wrap;
      word-break: break-word;
      margin: 0;
      padding: 10px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.26);
      border: 1px solid rgba(255, 255, 255, 0.06);
      color: var(--text-primary);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
    }
    .finding-critical {
      background: #3b0a0a;
      border-color: var(--accent-red);
    }
    .finding-critical .finding-severity {
      color: var(--accent-red);
      border: 1px solid var(--accent-red);
      background: rgba(255, 0, 85, 0.12);
      text-shadow: 0 0 8px var(--accent-red-glow);
    }
    .finding-high {
      background: #3d2a0a;
      border-color: var(--accent-amber);
    }
    .finding-high .finding-severity {
      color: var(--accent-amber);
      border: 1px solid var(--accent-amber);
      background: rgba(255, 179, 71, 0.12);
      text-shadow: 0 0 8px var(--accent-amber-glow);
    }
    .finding-medium {
      background: #0a2a3d;
      border-color: var(--accent-cyan);
    }
    .finding-medium .finding-severity {
      color: var(--accent-cyan);
      border: 1px solid var(--accent-cyan);
      background: rgba(0, 255, 209, 0.1);
      text-shadow: 0 0 8px var(--accent-cyan-glow);
    }
    .finding-low {
      background: #0a3d2a;
      border-color: var(--green-neon);
    }
    .finding-low .finding-severity {
      color: var(--green-neon);
      border: 1px solid var(--green-neon);
      background: rgba(34, 197, 94, 0.1);
    }
    .finding-info {
      background: #1a1f2e;
      border-color: #5F6C84;
    }
    .finding-info .finding-severity {
      color: #AEB8CB;
      border: 1px solid #5F6C84;
      background: rgba(95, 108, 132, 0.16);
    }

    /* CORRELACIONES */
    .correlations-card {
      background:
        radial-gradient(circle at top left, rgba(0, 255, 209, 0.09), transparent 32%),
        var(--bg-panel);
    }
    .correlation-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 14px;
    }
    .correlation-row {
      --mouse-x: 50%;
      --mouse-y: 50%;
      --tilt-x: 0deg;
      --tilt-y: 0deg;
      --lift: 0px;
      position: relative;
      overflow: hidden;
      display: grid;
      gap: 10px;
      padding: 16px;
      border: 1px solid rgba(0, 255, 209, 0.16);
      border-left: 4px solid var(--accent-cyan);
      border-radius: 16px;
      background: rgba(10, 14, 23, 0.72);
      transform: perspective(900px) rotateX(var(--tilt-x)) rotateY(var(--tilt-y)) translateY(var(--lift));
      transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
    }
    .correlation-row::before {
      content: "";
      position: absolute;
      inset: -35% auto auto -18%;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: currentColor;
      opacity: 0.08;
      pointer-events: none;
    }
    .correlation-row:hover {
      --lift: -2px;
      border-color: rgba(0, 255, 209, 0.42);
      box-shadow: 0 18px 34px rgba(0, 0, 0, 0.28), 0 0 18px rgba(0, 255, 209, 0.08);
    }
    .correlation-row header {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .correlation-row strong {
      color: var(--text-primary);
      line-height: 1.35;
    }
    .correlation-row p {
      color: var(--text-secondary);
      font-size: 0.84rem;
      line-height: 1.55;
    }
    .correlation-row.severity-critical { color: var(--accent-red); border-left-color: var(--accent-red); }
    .correlation-row.severity-high { color: #FF6B00; border-left-color: #FF6B00; }
    .correlation-row.severity-medium { color: var(--accent-amber); border-left-color: var(--accent-amber); }
    .correlation-row.severity-low { color: var(--green-neon); border-left-color: var(--green-neon); }
    .correlation-row.severity-info { color: var(--accent-cyan); border-left-color: var(--accent-cyan); }

    /* TABLAS RESPONSIVE */
    .terminal-table-wrap {
      overflow-x: auto;
    }
    .terminal-table {
      width: 100%;
      border-collapse: collapse;
    }
    .terminal-table th, .terminal-table td {
      padding: 8px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      font-size: 0.75rem;
    }

    /* RESPONSIVE */
    @media (max-width: 780px) {
      .topbar-inner {
        grid-template-columns: 1fr;
        justify-items: center;
        text-align: center;
        min-height: 0;
      }
      .brand {
        order: 2;
      }
      .brand strong {
        letter-spacing: -1.5px;
      }
      .brand strong::after {
        left: 6%;
        transform-origin: center;
      }
      .brand-logo-wrap {
        order: 1;
        width: 128px;
      }
      .ai-status {
        order: 3;
        justify-self: center;
      }
      .pipeline-stepper {
        flex-wrap: wrap;
        justify-content: flex-start;
        row-gap: 16px;
      }
      .pipeline-stepper::before,
      .pipeline-step::before {
        display: none;
      }
      .pipeline-step {
        flex: 0 0 20%;
      }
      .pipeline-tooltip {
        bottom: calc(100% + 14px);
        top: auto;
      }
      .dashboard-top {
        grid-template-columns: 1fr;
      }
      .dashboard-head {
        align-items: flex-start;
        flex-direction: column;
      }
      .dashboard-grid {
        grid-template-columns: 1fr;
      }
      .tool-distribution {
        grid-template-columns: 1fr;
      }
      .tool-donut {
        width: min(148px, 52vw);
      }
      .metric-strip {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .chart-row {
        grid-template-columns: 78px 1fr 30px;
      }
      .buttons {
        flex-wrap: wrap;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <strong>EscanerWeb</strong>
      </div>
      <div class="brand-logo-wrap" aria-label="Logo EscanerWeb">
        <img class="brand-logo" src="assets/header-logo.gif" alt="Logo EscanerWeb">
      </div>
      <div class="ai-status">
        <span class="status-light" aria-hidden="true"></span>
        <i class="fas fa-microchip"></i>
        <span>Motor IA activo</span>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="panel">
      <h1><i class="fas fa-terminal"></i> CONSOLA DE ATAQUE</h1>
      <div class="scan-form">
        <label for="prompt">objetivo / prompt</label>
        <input id="prompt" placeholder="Inserta la URL de la página a escanear" autocomplete="off">
        <div class="buttons">
          <button id="btnAnalizar"><i class="fas fa-bolt"></i> ejecutar análisis</button>
          <button id="btnGenerarInforme" disabled><i class="fas fa-file-pdf"></i> informe PDF</button>
        </div>
      </div>
      <div id="estado" class="status"></div>
    </section>

    <section id="resultados" class="results"></section>
  </main>

  <script src="app.js"></script>
  <script>
    // Interfaz visual restaurada sin interferir con la lógica original.
    console.log("Interfaz cyberpunk operativa cargada");
  </script>
</body>
</html>
