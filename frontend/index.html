<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>EscanerWeb v2.0 · Pentesting Autónomo con IA</title>

  <!-- Fuentes modernas -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Font Awesome 6 (gratuito) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <style>
    /* ----------------------------------------------
       VARIABLES CYBERPUNK OPERATIVO
    ----------------------------------------------- */
    :root {
      --bg-deep: #0A0E17;
      --bg-panel: #111827;
      --bg-soft: #0F131C;
      --border: #1F2937;
      --border-glow: #2D3A5E;
      --text-primary: #E5E7EB;
      --text-secondary: #9CA3AF;
      --accent-cyan: #00FFD1;
      --accent-cyan-glow: rgba(0, 255, 209, 0.3);
      --accent-red: #FF0055;
      --accent-red-glow: rgba(255, 0, 85, 0.3);
      --accent-amber: #FFB347;
      --accent-amber-glow: rgba(255, 179, 71, 0.3);
      --green-neon: #22C55E;
      --shadow-card: 0 12px 28px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(0, 255, 209, 0.05);
      --shadow-glow: 0 0 18px var(--accent-cyan-glow), 0 0 42px rgba(255, 0, 85, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg-deep);
      background-image: 
        linear-gradient(rgba(0, 255, 209, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 209, 0.02) 1px, transparent 1px);
      background-size: 32px 32px;
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      line-height: 1.5;
      scroll-behavior: smooth;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 999;
    }

    body::before {
      bottom: auto;
      height: 140px;
      background: linear-gradient(
        180deg,
        transparent 0%,
        rgba(0, 255, 209, 0.04) 45%,
        rgba(0, 255, 209, 0.12) 50%,
        rgba(255, 0, 85, 0.05) 53%,
        transparent 100%
      );
      animation: scanline 7s linear infinite;
      mix-blend-mode: screen;
    }

    body::after {
      opacity: 0.07;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.75'/%3E%3C/svg%3E");
    }

    @keyframes scanline {
      0% { transform: translateY(-160px); }
      100% { transform: translateY(calc(100vh + 160px)); }
    }

    /* Scrollbar personalizada */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-soft);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--accent-cyan);
      border-radius: 4px;
      box-shadow: 0 0 8px var(--accent-cyan-glow);
    }

    /* Tipografía mono para código */
    .terminal-text, code, pre, .priority-title, .log-line, .pipeline-node strong, .brand strong {
      font-family: 'JetBrains Mono', monospace;
    }

    /* TOPBAR */
    .topbar {
      border-bottom: 1px solid var(--border);
      background: rgba(17, 24, 39, 0.92);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .topbar-inner {
      width: min(1360px, calc(100% - 32px));
      min-height: 64px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .brand strong {
      font-size: 1.35rem;
      background: linear-gradient(135deg, #FFFFFF, var(--accent-cyan));
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      letter-spacing: -0.5px;
    }
    .brand span {
      font-size: 0.7rem;
      color: var(--text-secondary);
      display: block;
    }
    .terminal-subtle {
      font-size: 0.7rem;
      font-family: monospace;
      color: var(--accent-cyan);
    }

    /* CONTENEDOR PRINCIPAL */
    .container {
      width: min(1360px, calc(100% - 32px));
      margin: 28px auto 48px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* PANEL CONSOLA */
    .panel {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: var(--shadow-card);
      transition: border 0.2s, box-shadow 0.2s, transform 0.2s;
    }
    .panel:hover {
      border-color: var(--accent-cyan);
      box-shadow: var(--shadow-card), var(--shadow-glow);
    }
    h1 {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--accent-cyan);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      position: relative;
    }
    h1:hover,
    .terminal-card:hover h2,
    .terminal-card:hover h3,
    .brand:hover strong {
      animation: glitchText 820ms steps(2, end) 1;
      text-shadow: 1px 0 var(--accent-red), -1px 0 var(--accent-cyan);
    }
    h1 i {
      font-size: 1rem;
    }
    .scan-form {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: flex-end;
    }
    .scan-form label {
      flex: 1;
      min-width: 200px;
    }
    label {
      color: var(--text-secondary);
      font-size: 0.7rem;
      text-transform: uppercase;
      display: block;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      background: var(--bg-soft);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--text-primary);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      outline: none;
      transition: 0.2s;
    }
    input:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 0 2px var(--accent-cyan-glow);
    }
    .buttons {
      display: flex;
      gap: 10px;
    }
    button {
      background: transparent;
      border: 1px solid var(--accent-cyan);
      border-radius: 40px;
      padding: 8px 18px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--accent-cyan);
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    button:hover:not(:disabled) {
      background: var(--accent-cyan);
      color: #0A0E17;
      box-shadow: 0 0 12px var(--accent-cyan-glow);
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      border-color: var(--text-secondary);
      color: var(--text-secondary);
    }
    #btnGenerarInforme:not(:disabled) {
      background: transparent;
      border-color: var(--accent-red);
      color: var(--accent-red);
    }
    #btnGenerarInforme:hover:not(:disabled) {
      background: var(--accent-red);
      color: #0A0E17;
    }

    /* ESTADO / PROGRESO */
    .status {
      margin-top: 18px;
      padding: 12px;
      border-radius: 12px;
      background: var(--bg-soft);
      border-left: 3px solid var(--accent-cyan);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--text-secondary);
    }
    .status.success {
      border-left-color: var(--green-neon);
      background: rgba(34, 197, 94, 0.08);
    }
    .status.error {
      border-left-color: var(--accent-red);
      background: rgba(255, 0, 85, 0.08);
    }
    .status.loading {
      border-left-color: var(--accent-amber);
      animation: pulse 1.2s infinite;
    }

    .pipeline-progress {
      margin-top: 14px;
      padding: 12px;
      border: 1px solid rgba(0, 255, 209, 0.35);
      border-radius: 12px;
      background: linear-gradient(180deg, rgba(15, 19, 28, 0.96), rgba(10, 14, 23, 0.96));
      box-shadow: inset 0 0 18px rgba(0, 255, 209, 0.05), 0 0 14px rgba(0, 255, 209, 0.08);
    }
    .pipeline-progress-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      text-transform: uppercase;
      color: var(--text-secondary);
    }
    #pipelineProgressPercent {
      color: var(--accent-cyan);
      text-shadow: 0 0 8px var(--accent-cyan-glow);
    }
    .pipeline-progress-track {
      height: 12px;
      overflow: hidden;
      border: 1px solid rgba(0, 255, 209, 0.5);
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.35);
      position: relative;
    }
    .pipeline-progress-fill {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent-cyan), #00A3FF 48%, var(--accent-red));
      box-shadow: 0 0 14px var(--accent-cyan-glow), 0 0 20px var(--accent-red-glow);
      transition: width 0.35s ease;
    }
    .pipeline-progress.is-indeterminate .pipeline-progress-fill {
      width: 42%;
      animation: indeterminateProgress 1.15s ease-in-out infinite;
    }
    @keyframes pulse {
      0% { opacity: 0.6; }
      100% { opacity: 1; }
    }
    @keyframes indeterminateProgress {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(260%); }
    }
    @keyframes toolPulse {
      0%, 100% { box-shadow: 0 0 7px var(--accent-amber-glow); opacity: 0.78; }
      50% { box-shadow: 0 0 18px var(--accent-amber-glow); opacity: 1; }
    }
    @keyframes glitchText {
      0% { transform: translate(0); }
      18% { transform: translate(1px, -1px); }
      32% { transform: translate(-1px, 1px); }
      48% { transform: translate(1px, 0); }
      64% { transform: translate(-1px, -1px); }
      100% { transform: translate(0); }
    }

    /* RESULTADOS */
    .results {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    /* Dashboard resumen (grid de 3 columnas) */
    .dashboard-top {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 18px;
    }
    .terminal-card {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 18px;
      transition: transform 0.16s ease, border 0.2s, box-shadow 0.2s;
    }
    .terminal-card:hover {
      border-color: rgba(0, 255, 209, 0.6);
      box-shadow: var(--shadow-card), var(--shadow-glow);
      transform: translateY(-1px);
    }
    .terminal-card h2, .terminal-card h3 {
      font-size: 0.7rem;
      text-transform: uppercase;
      color: var(--accent-cyan);
      margin-bottom: 12px;
      letter-spacing: 1px;
    }
    .target-value {
      font-size: 1.2rem;
      word-break: break-word;
      color: var(--text-primary);
    }
    .rating-letter {
      font-size: 3rem;
      font-weight: 800;
      color: var(--accent-amber);
    }
    .risk-score-value {
      font-size: 2rem;
      font-weight: 700;
      color: var(--accent-cyan);
    }

    /* BADGES DE ESTADO */
    .terminal-badge, .badge, .tool-status {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 2px 8px;
      border-radius: 40px;
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      background: var(--bg-deep);
      border: 1px solid var(--border);
    }
    .status-run {
      color: var(--accent-amber);
      border-color: var(--accent-amber);
      background: rgba(255, 179, 71, 0.08);
      text-shadow: 0 0 8px var(--accent-amber-glow);
      animation: toolPulse 1.15s ease-in-out infinite;
    }
    .status-ok {
      color: var(--accent-cyan);
      border-color: var(--accent-cyan);
      background: rgba(0, 255, 209, 0.08);
      text-shadow: 0 0 8px var(--accent-cyan-glow);
      box-shadow: 0 0 10px rgba(0, 255, 209, 0.12);
    }
    .status-fail,
    .status-error {
      color: var(--accent-red);
      border-color: var(--accent-red);
      background: rgba(255, 0, 85, 0.08);
      text-shadow: 0 0 8px var(--accent-red-glow);
      box-shadow: 0 0 10px rgba(255, 0, 85, 0.12);
    }
    .status-skipped { color: var(--accent-amber); border-color: var(--accent-amber); }

    /* PIPELINE (mejorado) */
    .pipeline-timeline {
      display: flex;
      flex-wrap: wrap;
      gap: 2px;
      background: var(--bg-soft);
      border-radius: 12px;
      overflow: hidden;
    }
    .pipeline-node {
      flex: 1;
      min-width: 140px;
      padding: 12px;
      border-right: 1px solid var(--border);
      position: relative;
      background: var(--bg-panel);
      transition: border 0.2s, background 0.2s, box-shadow 0.2s, transform 0.2s;
    }
    .pipeline-node:last-child {
      border-right: none;
    }
    .pipeline-node strong {
      display: block;
      font-size: 0.7rem;
    }
    .terminal-badge {
      margin-top: 6px;
    }

    .timeline-run {
      border-color: rgba(255, 179, 71, 0.6);
      background: rgba(255, 179, 71, 0.08);
      box-shadow: inset 0 0 18px rgba(255, 179, 71, 0.05);
      color: var(--accent-amber);
      animation: toolPulse 1.2s ease-in-out infinite;
    }
    .timeline-ok {
      border-color: rgba(0, 255, 209, 0.6);
      background: rgba(0, 255, 209, 0.08);
      box-shadow: inset 0 0 18px rgba(0, 255, 209, 0.05);
      color: var(--accent-cyan);
    }
    .timeline-fail {
      border-color: rgba(255, 0, 85, 0.72);
      background: rgba(255, 0, 85, 0.09);
      box-shadow: inset 0 0 18px rgba(255, 0, 85, 0.06);
      color: var(--accent-red);
    }
    .timeline-warn,
    .timeline-skip {
      border-color: rgba(255, 179, 71, 0.5);
      background: rgba(255, 179, 71, 0.06);
      color: var(--accent-amber);
    }
    .timeline-pending {
      opacity: 0.68;
    }
    .pipeline-node.timeline-run .terminal-badge,
    .terminal-badge.timeline-run {
      color: var(--accent-amber);
      border-color: var(--accent-amber);
      background: rgba(255, 179, 71, 0.08);
    }
    .pipeline-node.timeline-ok .terminal-badge,
    .terminal-badge.timeline-ok {
      color: var(--accent-cyan);
      border-color: var(--accent-cyan);
      background: rgba(0, 255, 209, 0.08);
    }
    .pipeline-node.timeline-fail .terminal-badge,
    .terminal-badge.timeline-fail {
      color: var(--accent-red);
      border-color: var(--accent-red);
      background: rgba(255, 0, 85, 0.08);
    }

    /* HALLAZGOS PRIORIZADOS */
    .priority-list {
      display: grid;
      gap: 12px;
    }
    .priority-row {
      background: var(--bg-soft);
      border-left: 3px solid var(--accent-cyan);
      border-radius: 12px;
      overflow: hidden;
    }
    .priority-row summary {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      padding: 14px;
      cursor: pointer;
      list-style: none;
    }
    .priority-row summary::-webkit-details-marker {
      display: none;
    }
    .priority-title {
      font-weight: 700;
      flex: 2;
    }
    .priority-body {
      padding: 14px;
      border-top: 1px solid var(--border);
    }

    .finding-groups {
      display: grid;
      gap: 12px;
    }
    .finding-group {
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      background: rgba(10, 14, 23, 0.62);
    }
    .finding-group summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 14px;
      cursor: pointer;
      list-style: none;
      color: var(--accent-cyan);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      text-transform: uppercase;
    }
    .finding-group summary::-webkit-details-marker {
      display: none;
    }
    .finding-grid {
      display: grid;
      gap: 12px;
      padding: 14px;
      border-top: 1px solid var(--border);
    }
    .finding-card {
      border: 1px solid var(--border);
      border-left-width: 4px;
      border-radius: 10px;
      padding: 14px;
      display: grid;
      gap: 9px;
    }
    .finding-card header,
    .finding-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }
    .finding-card h3 {
      color: var(--text-primary);
      font-size: 0.95rem;
      line-height: 1.35;
    }
    .finding-card p {
      color: var(--text-secondary);
      font-size: 0.82rem;
    }
    .finding-severity {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 9px;
      border-radius: 999px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.66rem;
      font-weight: 700;
      text-transform: uppercase;
    }
    .finding-meta {
      color: var(--text-secondary);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
    }
    .finding-evidence {
      white-space: pre-wrap;
      word-break: break-word;
      margin: 0;
      padding: 10px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.26);
      border: 1px solid rgba(255, 255, 255, 0.06);
      color: var(--text-primary);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
    }
    .finding-critical {
      background: #3b0a0a;
      border-color: var(--accent-red);
    }
    .finding-critical .finding-severity {
      color: var(--accent-red);
      border: 1px solid var(--accent-red);
      background: rgba(255, 0, 85, 0.12);
      text-shadow: 0 0 8px var(--accent-red-glow);
    }
    .finding-high {
      background: #3d2a0a;
      border-color: var(--accent-amber);
    }
    .finding-high .finding-severity {
      color: var(--accent-amber);
      border: 1px solid var(--accent-amber);
      background: rgba(255, 179, 71, 0.12);
      text-shadow: 0 0 8px var(--accent-amber-glow);
    }
    .finding-medium {
      background: #0a2a3d;
      border-color: var(--accent-cyan);
    }
    .finding-medium .finding-severity {
      color: var(--accent-cyan);
      border: 1px solid var(--accent-cyan);
      background: rgba(0, 255, 209, 0.1);
      text-shadow: 0 0 8px var(--accent-cyan-glow);
    }
    .finding-low {
      background: #0a3d2a;
      border-color: var(--green-neon);
    }
    .finding-low .finding-severity {
      color: var(--green-neon);
      border: 1px solid var(--green-neon);
      background: rgba(34, 197, 94, 0.1);
    }
    .finding-info {
      background: #1a1f2e;
      border-color: #5F6C84;
    }
    .finding-info .finding-severity {
      color: #AEB8CB;
      border: 1px solid #5F6C84;
      background: rgba(95, 108, 132, 0.16);
    }

    /* TABLAS RESPONSIVE */
    .terminal-table-wrap {
      overflow-x: auto;
    }
    .terminal-table {
      width: 100%;
      border-collapse: collapse;
    }
    .terminal-table th, .terminal-table td {
      padding: 8px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      font-size: 0.75rem;
    }

    /* RESPONSIVE */
    @media (max-width: 780px) {
      .pipeline-node {
        min-width: 100%;
      }
      .dashboard-top {
        grid-template-columns: 1fr;
      }
      .buttons {
        flex-wrap: wrap;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <strong>〈 EscanerWeb v2.0 〉</strong>
        <span>pentesting autónomo · motor IA</span>
      </div>
      <div class="terminal-subtle">
        <i class="fas fa-microchip"></i> Ollama · modo puente
      </div>
    </div>
  </header>

  <main class="container">
    <section class="panel">
      <h1><i class="fas fa-terminal"></i> CONSOLA DE ATAQUE</h1>
      <div class="scan-form">
        <label for="prompt">objetivo / prompt</label>
        <input id="prompt" placeholder="demo.owasp-juice.shop" autocomplete="off">
        <div class="buttons">
          <button id="btnAnalizar"><i class="fas fa-bolt"></i> ejecutar análisis</button>
          <button id="btnGenerarInforme" disabled><i class="fas fa-file-pdf"></i> informe PDF</button>
        </div>
      </div>
      <div id="estado" class="status"></div>
      <div id="pipelineProgress" class="pipeline-progress" aria-live="polite">
        <div class="pipeline-progress-head">
          <span>Progreso del pipeline</span>
          <strong id="pipelineProgressPercent">0%</strong>
        </div>
        <div class="pipeline-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div id="pipelineProgressFill" class="pipeline-progress-fill"></div>
        </div>
      </div>
    </section>
