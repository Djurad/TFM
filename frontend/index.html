<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EscanerWeb v1.0 - Auditoria web</title>

  <style>
    :root {
      --bg: #f4f7fb;
      --panel: #ffffff;
      --panel-soft: #f8fafc;
      --line: #d8e0ea;
      --line-soft: #e8edf3;
      --green: #16a34a;
      --green-soft: #15803d;
      --muted: #64748b;
      --amber: #d97706;
      --red: #dc2626;
      --cyan: #0284c7;
      --gray: #94a3b8;
      --text: #172033;
      --shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
      --shadow-soft: 0 4px 14px rgba(15, 23, 42, 0.06);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(rgba(2, 132, 199, 0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(2, 132, 199, 0.035) 1px, transparent 1px),
        radial-gradient(circle at top left, rgba(2, 132, 199, 0.09), transparent 34%),
        var(--bg);
      background-size: 28px 28px;
      color: var(--text);
      font-family: "JetBrains Mono", "Fira Code", Consolas, "Courier New", monospace;
      letter-spacing: 0;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        rgba(15, 23, 42, 0.018),
        rgba(15, 23, 42, 0.018) 1px,
        transparent 1px,
        transparent 4px
      );
      opacity: 0.18;
    }

    .topbar {
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.92);
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(16px);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .topbar-inner {
      width: min(1360px, calc(100% - 32px));
      min-height: 72px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(220px, 1fr);
      gap: 18px;
      align-items: center;
    }

    .brand strong {
      display: block;
      color: var(--cyan);
      text-transform: uppercase;
      font-size: 18px;
    }

    .brand span,
    .terminal-subtle {
      color: var(--muted);
      font-size: 12px;
    }

    .container {
      width: min(1360px, calc(100% - 32px));
      margin: 24px auto 48px;
      display: grid;
      gap: 18px;
    }

    .terminal-card,
    .panel,
    .summary-item,
    .tool-row,
    .finding,
    .surface-details,
    .candidate-block,
    .empty,
    .notice {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      box-shadow: var(--shadow-soft);
    }

    .panel {
      padding: 18px;
    }

    .terminal-section-title,
    h1,
    h2,
    h3 {
      margin: 0;
      color: var(--cyan);
      text-transform: uppercase;
      font-weight: 700;
    }

    h1 {
      font-size: 18px;
      margin-bottom: 14px;
    }

    .scan-form {
      display: grid;
      gap: 12px;
    }

    label {
      color: var(--muted);
      font-size: 13px;
      text-transform: lowercase;
    }

    label::before {
      content: "target > ";
      color: var(--cyan);
    }

    input {
      width: 100%;
      height: 42px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--panel-soft);
      color: var(--text);
      font: inherit;
      outline: none;
    }

    input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.14);
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    button {
      min-height: 38px;
      padding: 0 14px;
      border: 1px solid var(--cyan);
      border-radius: 4px;
      background: var(--cyan);
      color: #ffffff;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      text-transform: lowercase;
    }

    button:hover:not(:disabled) {
      background: #0369a1;
      border-color: #0369a1;
    }

    button:disabled {
      cursor: not-allowed;
      color: var(--gray);
      background: var(--panel-soft);
      border-color: var(--line);
    }

    #btnGenerarInforme:not(:disabled) {
      background: var(--panel);
      color: var(--cyan);
    }

    #btnGenerarInforme:hover:not(:disabled) {
      background: #eff6ff;
      border-color: var(--cyan);
    }

    #btnAnalizar::before {
      content: "[ ";
    }

    #btnAnalizar::after {
      content: " ]";
    }

    #btnGenerarInforme::before {
      content: "[ ";
    }

    #btnGenerarInforme::after {
      content: " ]";
    }

    .status {
      margin-top: 14px;
      padding: 12px;
      border: 1px solid var(--line-soft);
      border-radius: 4px;
      background: var(--panel-soft);
      color: var(--muted);
      white-space: pre-line;
      line-height: 1.6;
    }

    .status:empty {
      display: none;
    }

    .status.success {
      color: var(--green);
      background: #f0fdf4;
      border-color: rgba(22, 163, 74, 0.35);
    }

    .status.error {
      color: var(--red);
      background: #fef2f2;
      border-color: rgba(220, 38, 38, 0.35);
    }

    .status.loading {
      color: var(--amber);
      background: #fffbeb;
      border-color: rgba(217, 119, 6, 0.35);
    }

    .progress-status {
      display: grid;
      gap: 10px;
    }

    .progress-current {
      border-left: 2px solid var(--amber);
      padding-left: 10px;
    }

    .progress-tool {
      color: var(--cyan);
      font-weight: 700;
      text-transform: uppercase;
      overflow-wrap: anywhere;
    }

    .progress-message {
      color: var(--text);
      margin-top: 3px;
      overflow-wrap: anywhere;
    }

    .progress-log {
      grid-column: 1 / -1;
      margin: 8px 0 0;
      padding: 0;
      list-style: none;
      color: var(--muted);
      font-size: 12px;
      max-height: 116px;
      overflow: auto;
    }

    .progress-log li {
      border-top: 1px solid var(--line-soft);
      padding: 6px 0;
    }

    .progress-log span {
      color: var(--amber);
    }

    .risk-score-card,
    .pipeline-card,
    .correlations-card {
      display: grid;
      gap: 10px;
    }

    .risk-score-value {
      color: var(--cyan);
      font-size: 28px;
      font-weight: 700;
    }

    .risk-score-value span {
      color: var(--amber);
      font-size: 16px;
    }

    .pipeline-timeline {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 0;
      border: 1px solid var(--line-soft);
      background: var(--panel-soft);
    }

    .pipeline-node {
      position: relative;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 5px 8px;
      align-items: center;
      min-height: 58px;
      padding: 9px 10px;
      border-right: 1px solid var(--line-soft);
      border-bottom: 1px solid var(--line-soft);
      font-size: 12px;
    }

    .pipeline-node::after {
      content: ">";
      position: absolute;
      right: -5px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gray);
      background: var(--panel-soft);
      z-index: 1;
    }

    .pipeline-node strong {
      color: var(--text);
      text-transform: uppercase;
      overflow-wrap: anywhere;
    }

    .pipeline-node span:not(.terminal-badge) {
      grid-column: 2;
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    .pipeline-node small {
      grid-column: 1 / -1;
      color: var(--gray);
    }

    .timeline-important {
      background: #fffbeb;
    }

    .timeline-ok .terminal-badge {
      color: var(--green);
      background: #f0fdf4;
      border-color: rgba(22, 163, 74, 0.35);
    }

    .timeline-fail .terminal-badge {
      color: var(--red);
      background: #fef2f2;
      border-color: rgba(220, 38, 38, 0.35);
    }

    .timeline-skip .terminal-badge,
    .timeline-warn .terminal-badge {
      color: var(--amber);
      background: #fffbeb;
      border-color: rgba(217, 119, 6, 0.35);
    }

    .timeline-run .terminal-badge {
      color: var(--amber);
      background: #fffbeb;
      border-color: rgba(217, 119, 6, 0.35);
    }

    .timeline-run {
      background: #fffbeb;
    }

    .timeline-pending {
      opacity: 0.55;
    }

    .timeline-pending .terminal-badge {
      color: var(--gray);
      background: var(--panel);
      border-color: var(--line);
    }

    .correlation-list {
      display: grid;
      gap: 8px;
    }

    .correlation-row {
      border: 1px solid var(--line-soft);
      border-left: 3px solid var(--cyan);
      border-radius: 6px;
      padding: 10px;
      background: var(--panel-soft);
    }

    .correlation-row header {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 7px;
    }

    .correlation-row strong {
      color: var(--text);
    }

    .correlation-row p {
      margin: 0 0 7px;
      color: var(--text);
      line-height: 1.45;
      font-size: 13px;
    }

    .relation-list {
      margin-top: 6px;
    }

    .dashboard-top {
      display: grid;
      grid-template-columns: minmax(260px, 1.1fr) minmax(180px, 0.7fr) minmax(280px, 1.2fr);
      gap: 14px;
    }

    .terminal-card {
      padding: 14px;
      overflow: hidden;
    }

    .terminal-card h2,
    .terminal-card h3 {
      font-size: 13px;
      margin-bottom: 10px;
    }

    .target-value {
      color: var(--cyan);
      font-size: 20px;
      overflow-wrap: anywhere;
    }

    .rating-letter {
      color: var(--amber);
      font-size: 56px;
      line-height: 0.95;
      font-weight: 700;
    }

    .risk-bar {
      color: var(--cyan);
      margin-top: 10px;
      white-space: nowrap;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(7, minmax(130px, 1fr));
      gap: 10px;
    }

    .summary-item {
      padding: 12px;
      min-height: 94px;
      display: grid;
      gap: 6px;
      align-content: center;
    }

    .summary-item span {
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
    }

    .summary-item strong {
      color: var(--cyan);
      font-size: 30px;
      line-height: 1;
    }

    .summary-confirmadas strong,
    .summary-total_vulnerabilidades strong {
      color: var(--red);
    }

    .summary-posibles strong,
    .summary-hardening strong {
      color: var(--amber);
    }

    .tools {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 12px;
    }

    .tools::before {
      content: "HERRAMIENTAS EJECUTADAS";
      grid-column: 1 / -1;
      color: var(--cyan);
      font-weight: 700;
      font-size: 14px;
      margin-top: 4px;
    }

    .tool-row {
      display: grid;
      grid-template-columns: minmax(110px, 0.8fr) 80px minmax(180px, 1.4fr) 46px;
      gap: 10px;
      align-items: start;
      padding: 9px 10px;
      font-size: 12px;
      min-width: 0;
    }

    .tool-header {
      color: var(--muted);
      text-transform: uppercase;
      border-color: var(--line-soft);
      background: var(--panel-soft);
    }

    .tool-row strong {
      color: var(--text);
      overflow-wrap: anywhere;
    }

    .tool-row small {
      grid-column: 1 / -1;
      color: var(--amber);
      overflow-wrap: anywhere;
    }

    .tool-status,
    .badge,
    .severity,
    .terminal-badge {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      min-height: 22px;
      padding: 0 7px;
      border: 1px solid var(--line-soft);
      border-radius: 4px;
      background: var(--panel-soft);
      color: var(--cyan);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .status-ok {
      color: var(--green);
      background: #f0fdf4;
      border-color: rgba(22, 163, 74, 0.35);
    }

    .status-error {
      color: var(--red);
      background: #fef2f2;
      border-color: rgba(220, 38, 38, 0.35);
    }

    .status-skipped {
      color: var(--amber);
      background: #fffbeb;
      border-color: rgba(217, 119, 6, 0.35);
    }

    .results {
      display: grid;
      gap: 16px;
    }

    .results-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(320px, 0.75fr);
      gap: 16px;
    }

    .side-stack,
    .bottom-grid {
      display: grid;
      gap: 14px;
    }

    .bottom-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .result-group {
      display: grid;
      gap: 10px;
    }

    .group-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    .group-header h2 {
      font-size: 14px;
    }

    .group-header span {
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 3px 8px;
      background: var(--panel-soft);
      color: var(--cyan);
      font-size: 12px;
    }

    .group-desc {
      margin: 0 0 10px;
      color: var(--muted);
      line-height: 1.45;
      font-size: 12px;
    }

    .terminal-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 12px;
      color: var(--muted);
      font-size: 12px;
    }

    .terminal-tabs span:first-child {
      color: var(--cyan);
    }

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 8px 0;
    }

    .filter-btn {
      min-height: 28px;
      padding: 0 8px;
      font-size: 11px;
      color: var(--muted);
      border-color: var(--line-soft);
      background: var(--panel);
    }

    .filter-btn.active {
      color: var(--cyan);
      border-color: rgba(2, 132, 199, 0.4);
      background: #eff6ff;
    }

    .prioritized-section {
      display: grid;
      gap: 10px;
    }

    .priority-list {
      display: grid;
      gap: 8px;
      margin-top: 8px;
    }

    .priority-row {
      border: 1px solid var(--line-soft);
      border-left: 3px solid var(--cyan);
      border-radius: 6px;
      background: var(--panel-soft);
      overflow: hidden;
    }

    .priority-row summary {
      display: grid;
      grid-template-columns: auto auto auto minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      padding: 10px;
      cursor: pointer;
      list-style: none;
    }

    .priority-row summary::-webkit-details-marker {
      display: none;
    }

    .priority-row summary::after {
      content: "ver detalles";
      color: var(--muted);
      font-size: 11px;
      grid-column: 5;
      grid-row: 2;
      justify-self: end;
    }

    .priority-row[open] summary::after {
      content: "ocultar detalles";
    }

    .priority-title {
      color: var(--text);
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .priority-tool,
    .priority-meta {
      color: var(--muted);
      font-size: 12px;
    }

    .priority-body {
      border-top: 1px solid var(--line-soft);
      padding: 10px;
      display: grid;
      gap: 10px;
    }

    .ai-reason {
      margin: 0;
      color: var(--text);
      line-height: 1.45;
      font-size: 13px;
    }

    .category-explotable {
      color: var(--red);
      background: #fef2f2;
      border-color: rgba(220, 38, 38, 0.35);
    }

    .category-posible,
    .category-hardening {
      color: var(--amber);
      background: #fffbeb;
      border-color: rgba(217, 119, 6, 0.35);
    }

    .category-gf {
      color: var(--amber);
      background: #fffbeb;
      border-color: rgba(217, 119, 6, 0.35);
    }

    .category-superficie {
      color: var(--green);
      background: #f0fdf4;
      border-color: rgba(22, 163, 74, 0.35);
    }

    .category-info {
      color: var(--cyan);
      background: #eff6ff;
      border-color: rgba(2, 132, 199, 0.35);
    }

    .category-descartado {
      color: var(--gray);
      background: var(--panel);
      border-color: var(--line);
    }

    .group-list {
      display: grid;
      gap: 10px;
    }

    .finding {
      padding: 13px;
      border-left-width: 3px;
    }

    .finding h2 {
      font-size: 16px;
      margin: 10px 0 8px;
    }

    .finding p {
      margin: 0 0 12px;
      color: var(--text);
      line-height: 1.5;
      font-size: 13px;
    }

    .finding header {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
    }

    dl {
      display: grid;
      grid-template-columns: 130px minmax(0, 1fr);
      gap: 7px 12px;
      margin: 0;
      font-size: 12px;
    }

    dt {
      color: var(--muted);
      text-transform: uppercase;
    }

    dd {
      margin: 0;
      overflow-wrap: anywhere;
      color: var(--text);
      white-space: pre-wrap;
    }

    .mono-box {
      border: 1px solid var(--line-soft);
      background: var(--panel);
      padding: 8px;
      border-radius: 4px;
      overflow-wrap: anywhere;
    }

    .compact-list {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
      font-size: 12px;
    }

    .compact-list li {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      border-bottom: 1px solid var(--line-soft);
      padding-bottom: 7px;
    }

    .compact-list li:last-child {
      border-bottom: 0;
      padding-bottom: 0;
    }

    .terminal-table-wrap {
      overflow-x: auto;
    }

    .terminal-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      min-width: 320px;
    }

    .terminal-table th,
    .terminal-table td {
      border-bottom: 1px solid var(--line-soft);
      padding: 8px;
      text-align: left;
      white-space: nowrap;
    }

    .terminal-table th {
      color: var(--cyan);
      text-transform: uppercase;
      font-weight: 700;
    }

    .badge-confirmed,
    .severity-critical {
      color: var(--red);
      background: #fef2f2;
      border-color: rgba(220, 38, 38, 0.35);
    }

    .badge-possible,
    .severity-high,
    .severity-medium {
      color: var(--amber);
      background: #fffbeb;
      border-color: rgba(217, 119, 6, 0.35);
    }

    .badge-surface,
    .severity-low {
      color: var(--green);
      background: #f0fdf4;
      border-color: rgba(22, 163, 74, 0.35);
    }

    .badge-info,
    .severity-info {
      color: var(--cyan);
      background: #eff6ff;
      border-color: rgba(2, 132, 199, 0.35);
    }

    .badge-discarded {
      color: var(--gray);
      background: var(--panel);
      border-color: var(--line);
    }

    .finding.severity-critical,
    .finding.severity-high {
      border-color: rgba(220, 38, 38, 0.5);
    }

    .finding.severity-medium {
      border-color: rgba(217, 119, 6, 0.5);
    }

    .priority-row.severity-critical,
    .priority-row.severity-high {
      border-left-color: var(--red);
    }

    .priority-row.severity-medium {
      border-left-color: var(--amber);
    }

    .surface-details {
      padding: 12px;
    }

    .surface-details summary {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      color: var(--cyan);
      font-weight: 700;
      text-transform: uppercase;
      font-size: 13px;
    }

    .gf-candidates {
      display: grid;
      gap: 10px;
      margin-top: 10px;
    }

    .candidate-block {
      padding: 10px;
    }

    .candidate-block h3 {
      font-size: 13px;
      margin-bottom: 8px;
    }

    .candidate-block ul {
      margin: 0;
      padding-left: 18px;
      color: var(--muted);
      font-size: 12px;
    }

    .empty {
      margin: 0;
      padding: 12px;
      color: var(--muted);
    }

    .notice {
      margin: 0;
      padding: 12px;
      color: var(--amber);
      background: #fffbeb;
      border-color: rgba(217, 119, 6, 0.35);
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 1000px) {
      .topbar-inner,
      .dashboard-top,
      .results-grid,
      .bottom-grid,
      .tools {
        grid-template-columns: 1fr;
      }

    }

    @media (max-width: 760px) {
      .summary,
      .tool-row,
      .priority-row summary,
      dl {
        grid-template-columns: 1fr;
      }

      .pipeline-timeline {
        grid-template-columns: 1fr;
      }

      .pipeline-node::after {
        content: "|";
        right: auto;
        left: 18px;
        top: auto;
        bottom: -10px;
        transform: none;
      }

      .finding header {
        align-items: flex-start;
        flex-direction: column;
      }

      .topbar-inner {
        width: min(100% - 20px, 1360px);
      }

      .container {
